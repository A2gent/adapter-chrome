<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 6px; font: 13px system-ui, sans-serif; color-scheme: light dark; }
  .modes { display: flex; gap: 4px; }
  button { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 64px; padding: 6px 0; border: 1px solid transparent; border-radius: 8px; background: none; color: inherit; font: inherit; cursor: pointer; }
  button:hover { background: rgba(127, 127, 127, 0.15); }
  button[aria-pressed="true"] { border-color: #4f7cff; background: rgba(79, 124, 255, 0.15); }
  button span { font-size: 20px; }
  .settings { width: auto; padding: 6px 8px; justify-content: center; }
</style>
<div class="modes">
  <button data-mode="audio" title="Audio: read articles aloud (HearHear)"><span>🎧</span>Audio</button>
  <button data-mode="design" title="Design: annotate the page and start a Brute session"><span>✏️</span>Design</button>
  <button data-mode="sync" title="Sync: LinkedIn profiles → Brute people"><span>👥</span>Sync</button>
  <button class="settings" id="settings" title="HearHear settings"><span>⚙️</span></button>
</div>
<div id="error" style="color:#e5484d;font-size:12px;max-width:260px"></div>
<script src="popup.js"></script>
</html>
