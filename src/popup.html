<!doctype html>
<html lang="en">
<meta charset="utf-8">
<style>
  html { color-scheme: light dark; }
  body { width: 230px; margin: 0; padding: 4px; font: 13px system-ui, sans-serif; }
  [hidden] { display: none !important; }
  hr { margin: 4px 8px; border: 0; border-top: 1px solid rgba(127, 127, 127, 0.3); }
  .item { display: flex; align-items: center; gap: 8px; box-sizing: border-box; width: 100%; min-height: 30px; padding: 4px 8px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .item:hover { background: rgba(127, 127, 127, 0.15); }
  .item:focus-visible { outline: 2px solid #4f7cff; outline-offset: -2px; }
  .item input { margin: 0 0 0 auto; flex: none; }
  .icon { flex: none; width: 20px; font-size: 15px; text-align: center; }
  .sub { padding-left: 36px; }
  .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  [aria-pressed="true"] { background: rgba(79, 124, 255, 0.15); }
  [aria-pressed="true"]::after { content: "✓"; margin-left: auto; color: #4f7cff; font-weight: 700; }
  #error { padding: 0 8px 4px; color: #e5484d; font-size: 12px; }
  #error:empty { display: none; }
</style>
<button class="item" data-mode="audio" title="Read articles aloud (HearHear)"><span class="icon">🎧</span>Audio</button>
<button class="item" data-mode="design" title="Annotate the page and start a Brute session"><span class="icon">✏️</span>Design</button>
<button class="item" data-mode="sync" title="LinkedIn profiles → Brute people"><span class="icon">👥</span>Sync</button>
<hr>
<label class="item" title="Hide ads recognized by System One. Ad-like page blocks are sent to the classifier."><span class="icon">🛡️</span>Adblock<input type="checkbox" id="adblock"></label>
<label class="item sub" id="adblock-site-row" title="Adblock on this site" hidden><span class="grow" id="adblock-host"></span><input type="checkbox" id="adblock-site"></label>
<button class="item sub" id="adblock-reset" title="Forget ads learned on this site" hidden><span class="grow">🧹 Forget learned</span><b id="adblock-count"></b></button>
<div id="error"></div>
<hr>
<button class="item" id="settings" title="HearHear settings"><span class="icon">⚙️</span>Settings</button>
<script src="popup.js"></script>
<script src="popupAdblock.js"></script>
</html>
